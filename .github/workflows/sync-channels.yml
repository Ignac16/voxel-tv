name: Sync Excel to JSON

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true
      
      - name: Check if Excel file changed
        id: check-excel
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -q "src/constants/Voxel_TV_database.xlsx"; then
            echo "excel_changed=true" >> $GITHUB_OUTPUT
          else
            echo "excel_changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.check-excel.outputs.excel_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        if: steps.check-excel.outputs.excel_changed == 'true'
        run: npm install xlsx
      
      - name: Sync Excel to JSON
        if: steps.check-excel.outputs.excel_changed == 'true'
        run: |
          node -e "
          const XLSX = require('xlsx');
          const fs = require('fs');
          const workbook = XLSX.readFile('src/constants/Voxel_TV_database.xlsx');
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const data = XLSX.utils.sheet_to_json(sheet);
          fs.writeFileSync('src/constants/channels.json', JSON.stringify(data, null, 2));
          console.log('Channels synced successfully');
          "
      
      - name: Commit changes
        if: steps.check-excel.outputs.excel_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/constants/channels.json
          git diff --staged --quiet || git commit -m "Sync channels.json with Excel database"
          git push

name: Sync Excel to JSON

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true
      
      - name: Verify PAT_TOKEN is set
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "Error: PAT_TOKEN secret is not set. Please add it in repository settings."
            echo "Go to: Repository Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: PAT_TOKEN"
            echo "Value: Your GitHub Personal Access Token with 'repo' scope"
            exit 1
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install xlsx
      
      - name: Sync Excel to JSON
        run: |
          node -e "
          const XLSX = require('xlsx');
          const fs = require('fs');
          const workbook = XLSX.readFile('src/constants/Voxel_TV_database.xlsx');
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const data = XLSX.utils.sheet_to_json(sheet);
          fs.writeFileSync('src/constants/channels.json', JSON.stringify(data, null, 2));
          console.log('Channels synced successfully');
          "
      
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/constants/channels.json
          git diff --staged --quiet || git commit -m "Sync channels.json with Excel database"
          git push
